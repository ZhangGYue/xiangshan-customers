<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定位测试</title>
<script src="https://webapi.amap.com/maps?v=2.0&key=253a0a34d6e4872b51d5d4b9cebd1935&plugin=AMap.Geolocation&callback=__amapInit"></script>
</head>
<body style="font-family:sans-serif;padding:20px;max-width:600px;margin:0 auto;">
<h2>定位测试</h2>

<h3>目标地点</h3>
<p>东园东里250号<br>坐标: 118.310443, 24.598888</p>

<hr>

<h3>浏览器原生定位</h3>
<button onclick="testBrowser()">测试浏览器定位</button>
<div id="browserResult" style="margin-top:10px;"></div>

<h3>高德JS API定位</h3>
<button onclick="testAmap()">测试高德API定位</button>
<div id="amapResult" style="margin-top:10px;"></div>

<hr>

<h3>距离计算结果</h3>
<div id="distResult" style="margin-top:10px;font-size:18px;font-weight:bold;"></div>

<script>
window.__amapReady = false;
window.__amapInit = function() { window.__amapReady = true; };

const TARGET_LNG = 118.310443;
const TARGET_LAT = 24.598888;

function calcDistance(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2)**2 +
              Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) *
              Math.sin(dLng/2)**2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return (R * c * 1000).toFixed(0);
}

function testBrowser() {
    if (!navigator.geolocation) {
        document.getElementById('browserResult').innerHTML = '❌ 不支持';
        return;
    }
    navigator.geolocation.getCurrentPosition(
        pos => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const acc = pos.coords.accuracy;
            const d = calcDistance(lat, lng, TARGET_LAT, TARGET_LNG);
            document.getElementById('browserResult').innerHTML =
                `✅ 坐标: ${lng.toFixed(6)}, ${lat.toFixed(6)}<br>精度: ${acc}m<br>到东园东里250号: ${d}m`;
        },
        err => {
            document.getElementById('browserResult').innerHTML = '❌ 失败: ' + err.message;
        },
        { enableHighAccuracy: true, timeout: 15000 }
    );
}

function testAmap() {
    if (!window.AMap || !window.__amapReady) {
        document.getElementById('amapResult').innerHTML = '❌ 地图未加载，请稍后重试';
        return;
    }
    const geo = new AMap.Geolocation({ enableHighAccuracy: true, timeout: 15000 });
    geo.getCurrentPosition((status, result) => {
        if (status === 'complete') {
            const lat = result.position.lat;
            const lng = result.position.lng;
            const acc = result.accuracy;
            const d = calcDistance(lat, lng, TARGET_LAT, TARGET_LNG);
            document.getElementById('amapResult').innerHTML =
                `✅ 坐标: ${lng.toFixed(6)}, ${lat.toFixed(6)}<br>精度: ${acc}m<br>到东园东里250号: ${d}m`;
        } else {
            document.getElementById('amapResult').innerHTML = '❌ 失败: ' + (result.message || status);
        }
    });
}
</script>
</body>
</html>
