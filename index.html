        .header {

            padding: 10px 15px;

            color: #666;
            border-bottom: 1px solid #eee;
        }
        .shop-list {
            padding: 10px;
        }
        .shop-card {
            background: white;

            padding: 15px;

        .shop-card.visited {
            opacity: 0.7;

        }
        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;

        }
        .shop-name {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            flex: 1;
        }
        .shop-distance {
            background: #1890ff;
            color: white;
            padding: 2px 8px;

        }
        .shop-info {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }
        .shop-info span {

        }
        .category-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 5px;
        }
        .status-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 5px;
        }
        .status-待拜访 { background: #f0f0f0; color: #666; }
        .status-已拜访 { background: #1890ff; color: white; }
        .status-有意向 { background: #52c41a; color: white; }
        .status-已合作 { background: #722ed1; color: white; }
        .status-无意向 { background: #ff4d4f; color: white; }

            border-radius: 4px;

            user-select: none;
            -webkit-user-select: none;

        .btn-call {
            background: #52c41a;

            gap: 10px;
            margin-bottom: 8px;

            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .record-row button {

            background: #1890ff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: rgba(0,0,0,0.1);
            min-height: 36px;
        }

        .timeline {
            margin: 10px 0;
            padding-left: 20px;
            border-left: 2px solid #e8e8e8;
        }
        .timeline-item {
            position: relative;
            padding: 8px 0 8px 15px;
            margin-bottom: 5px;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -26px;
            top: 12px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #1890ff;
            border: 2px solid white;
            box-shadow: 0 0 0 2px #1890ff;
        }
        .timeline-item:first-child::before {
            background: #52c41a;
            box-shadow: 0 0 0 2px #52c41a;
        }
        .timeline-time {
            font-size: 12px;
            color: #999;
            margin-bottom: 3px;
        }
        .timeline-content {
            font-size: 13px;
            color: #333;
            background: #f6ffed;
            padding: 8px 10px;
            border-radius: 4px;
            border-left: 3px solid #52c41a;
        }
        .timeline-empty {
            font-size: 13px;
            color: #999;
            font-style: italic;
            padding: 10px 0;
        }

            gap: 10px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #f0f0f0;
        }
        .add-note-row input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .add-note-row button {

            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            min-height: 36px;
        }

            padding: 10px 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 12px;
            border-bottom: 1px solid #eee;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }
        /* 更多操作折叠面板 */
        .data-actions {
            background: white;
            padding: 10px 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            flex-wrap: wrap;
        }
        .data-actions > button {
            padding: 6px 12px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            min-height: 32px;
        }
        .data-actions > button:hover {
            background: #f5f5f5;
        }
        #moreActionsPanel {
            width: 100%;
            margin-top: 10px;
            gap: 10px;
            flex-wrap: wrap;
        }
        #moreActionsPanel button {
            padding: 8px 14px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            min-height: 36px;
        }
        #moreActionsPanel button:hover {
            background: #f5f5f5;
        }

            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 1px solid #eee;

            margin-bottom: 10px;

            flex-wrap: wrap;
            gap: 8px;
        }

            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: #f5f5f5;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .controls .checkbox-group label:hover {
            background: #e8e8e8;
        }
        .controls .checkbox-group input[type="checkbox"] {
            cursor: pointer;
        }
        .controls button {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            background: #1890ff;
            color: white;
            border: none;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;

            padding: 10px;
            border-bottom: 1px solid #eee;

        let myPosition = null;
        let visitRecords = {};
        const STORAGE_KEY = 'xiangshan_visit_records_v2';
        
        // 从localStorage加载拜访记录
        function loadRecords() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    visitRecords = JSON.parse(saved);
                } catch (e) {
                    visitRecords = {};
                }
            }
        }
        
        // 保存拜访记录到localStorage
        function saveRecords() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(visitRecords));
        }
        
        // 获取店铺记录（新数据结构）
        function getRecord(shopId) {
            return visitRecords[shopId] || { 
                status: '待拜访', 
                logs: [], 
                lastVisit: '' 
            };
        }
        
        // 格式化时间
        function formatTime(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            const h = String(date.getHours()).padStart(2, '0');
            const min = String(date.getMinutes()).padStart(2, '0');
            return `${y}-${m}-${d} ${h}:${min}`;
        }
        
        // 保存单条记录（添加新记录，保留历史）
        function saveRecord(shopId) {
            const status = document.getElementById(`status-${shopId}`).value;
            const note = document.getElementById(`note-${shopId}`).value.trim();
            const timestamp = formatTime(new Date());
            
            // 获取现有记录或创建新记录
            let record = visitRecords[shopId] || { status: '待拜访', logs: [], lastVisit: '' };
            
            // 更新状态
            record.status = status;
            
            // 如果有备注内容，添加到logs数组
            if (note) {
                record.logs = record.logs || [];
                record.logs.unshift({
                    note: note,
                    timestamp: timestamp
                });
                record.lastVisit = timestamp;
            }
            
            // 如果没有备注但有状态变化，也记录一条
            if (!note && record.status !== status) {
                record.logs = record.logs || [];
                record.logs.unshift({
                    note: `状态更新为：${status}`,
                    timestamp: timestamp
                });
                record.lastVisit = timestamp;
            }
            
            visitRecords[shopId] = record;
            saveRecords();
            
            // 更新显示
            filterShops();
        }
        
        // 删除单条跟进记录
        function deleteLog(shopId, logIndex) {
            if (!confirm('确定删除这条跟进记录吗？')) {
                return;
            }
            
            try {
                let record = visitRecords[shopId];
                
                if (record && record.logs && record.logs[logIndex] !== undefined) {
                    // 删除指定索引的记录
                    record.logs.splice(logIndex, 1);
                    
                    // 更新lastVisit为最新的记录时间（如果有）
                    if (record.logs.length > 0) {
                        record.lastVisit = record.logs[0].timestamp;
                    } else {
                        record.lastVisit = '';
                        // 如果没有记录了，重置状态为待拜访
                        record.status = '待拜访';
                    }
                    
                    saveRecords();
                    filterShops();
                } else {
                    console.error('[deleteLog] 未找到对应记录 - shopId:', shopId, 'logIndex:', logIndex);
                }
            } catch (err) {
                console.error('[deleteLog] 删除出错:', err);
            }
        }
        
        // 渲染时间轴
        function renderTimeline(shopId, logs) {
            if (!logs || logs.length === 0) {
                return '<div class="timeline-empty">暂无跟进记录</div>';
            }
            
            return `
                <div class="timeline">
                    ${logs.map((log, index) => `

                    `).join('')}
                </div>
            `;
        }
        
        // 导出数据
        function exportData() {
            const data = {

                records: visitRecords
            };
            const jsonStr = JSON.stringify(data, null, 2);
            
            // 尝试下载方式
            try {
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = '拜访记录_' + new Date().toLocaleDateString() + '.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                // 如果2秒后没有触发下载，提示复制
                setTimeout(() => {
                    fallbackToCopy(jsonStr);
                }, 500);
            } catch (e) {
                // 下载失败，使用复制方式
                fallbackToCopy(jsonStr);
            }
        }

            // 尝试使用 Clipboard API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(jsonStr).then(() => {
                    alert('✅ 数据已复制到剪贴板！\n\n请粘贴到微信/备忘录保存，换手机时粘贴导入。');
                }).catch(() => {
                    showCopyModal(jsonStr);
                });
            } else {
                showCopyModal(jsonStr);
            }
        }
        
        // 显示复制弹窗
        function showCopyModal(jsonStr) {
            const modal = document.createElement('div');
            modal.id = 'copyModal';
            modal.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; display:flex; align-items:center; justify-content:center;';
            modal.innerHTML = `
                <div style="background:#fff; border-radius:12px; padding:20px; width:90%; max-width:400px; max-height:80vh; overflow:hidden;">
                    <div style="font-weight:bold; font-size:16px; margin-bottom:15px;">📋 复制备份数据</div>
                    <div style="font-size:13px; color:#666; margin-bottom:10px;">请全选复制以下内容，粘贴到微信/备忘录保存：</div>
                    <textarea id="copyTextarea" style="width:100%; height:150px; border:1px solid #ddd; border-radius:8px; padding:10px; font-size:12px; resize:none;" readonly>${jsonStr}</textarea>
                    <div style="display:flex; gap:10px; margin-top:15px;">
                        <button onclick="copyFromModal()" style="flex:1; padding:12px; background:#1890ff; color:#fff; border:none; border-radius:8px; font-size:14px; cursor:pointer;">一键复制</button>
                        <button onclick="closeCopyModal()" style="flex:1; padding:12px; background:#f0f0f0; border:none; border-radius:8px; font-size:14px; cursor:pointer;">关闭</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }
        
        function copyFromModal() {
            const textarea = document.getElementById('copyTextarea');
            textarea.select();
            try {
                document.execCommand('copy');
                alert('✅ 已复制！请粘贴到微信/备忘录保存');
                closeCopyModal();
            } catch (e) {
                alert('复制失败，请手动长按选择复制');
            }
        }
        
        function closeCopyModal() {
            const modal = document.getElementById('copyModal');
            if (modal) modal.remove();
        }
        
        // 导入数据
        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.records) {
                            visitRecords = { ...visitRecords, ...data.records };
                            saveRecords();
                            filterShops();
                            alert('导入成功！');
                        }
                    } catch (err) {
                        alert('导入失败：' + err.message);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }
        
        // 清空数据 - 使用localStorage.removeItem()
        function clearData() {
            if (!confirm('确定要清空所有拜访记录吗？此操作不可恢复！')) {
                return;
            }
            
            try {
                // 1. 清空内存数据
                visitRecords = {};
                
                // 2. 尝试删除localStorage
                localStorage.removeItem(STORAGE_KEY);
                
                // 3. 更新界面
                filterShops();
                
                // 4. 强制刷新页面
                window.location.reload();
                
            } catch (err) {
                console.error('[clearData] 清空数据时出错:', err);
            }
        }
        
        // 计算距离
        function getDistance(lng1, lat1, lng2, lat2) {
            const R = 6371000;
            const rad = Math.PI / 180;
            const dLat = (lat2 - lat1) * rad;
            const dLng = (lng2 - lng1) * rad;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * rad) * Math.cos(lat2 * rad) *
                      Math.sin(dLng/2) * Math.sin(dLng/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }
        
        // 渲染店铺列表
        function renderShops(shopList) {
            const container = document.getElementById('shopList');
            const stats = document.getElementById('stats');
            
            if (shopList.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:50px;color:#999">没有符合条件的店铺</div>';
                stats.textContent = '共0家';
                return;
            }
            
            // 统计各状态数量
            const statusCount = {};
            shopList.forEach(s => {
                const r = getRecord(s.id);
                statusCount[r.status] = (statusCount[r.status] || 0) + 1;
            });
            const statusText = Object.entries(statusCount).map(([k,v]) => `${k}:${v}`).join(' | ');
            
            stats.innerHTML = `显示 ${shopList.length} 家店铺<br><small style="color:#999">${statusText}</small>`;
            
            container.innerHTML = shopList.map(shop => {
                const color = colorMap[shop.category] || "#95A5A6";
                const distanceText = shop.realDistance ? `${shop.realDistance}米` : '';
                const record = getRecord(shop.id);
                
                return `
                    <div class="shop-card ${record.status !== '待拜访' ? 'visited' : ''}">
                        <div class="shop-header">
                            <div class="shop-name">${shop.name}</div>
                            ${distanceText ? `<div class="shop-distance">${distanceText}</div>` : ''}
                        </div>
                        <div class="shop-info">
                            <span class="category-tag" style="background:${color}20;color:${color};border:1px solid ${color}">${shop.category}</span>
                            <span>${shop.town} · ${shop.village}</span>
                            ${record.status !== '待拜访' ? `<span class="status-tag status-${record.status}">${record.status}</span>` : ''}
                        </div>
                        <div class="shop-address">📍 ${shop.address}</div>
                        <div class="shop-actions">
                            ${shop.phone ? `<a href="tel:${shop.phone}" class="btn-call">📞 ${shop.phone}</a>` : ''}
                            <a href="https://uri.amap.com/navigation?to=${shop.lng},${shop.lat},${encodeURIComponent(shop.name)}&mode=car&policy=1" class="btn-nav">🚗 导航</a>
                        </div>
                        <div class="record-section">
                            <div class="record-row">
                                <select id="status-${shop.id}">
                                    <option value="待拜访" ${record.status === '待拜访' ? 'selected' : ''}>待拜访</option>
                                    <option value="已拜访" ${record.status === '已拜访' ? 'selected' : ''}>已拜访</option>
                                    <option value="有意向" ${record.status === '有意向' ? 'selected' : ''}>有意向</option>
                                    <option value="已合作" ${record.status === '已合作' ? 'selected' : ''}>已合作</option>
                                    <option value="无意向" ${record.status === '无意向' ? 'selected' : ''}>无意向</option>
                                </select>
                                <button onclick="saveRecord('${shop.id}')">保存</button>
                            </div>
                            ${renderTimeline(shop.id, record.logs)}
                            <div class="add-note-row">
                                <input type="text" id="note-${shop.id}" placeholder="添加新跟进记录...">
                                <button onclick="saveRecord('${shop.id}')">+ 添加</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // 筛选店铺
        function filterShops() {
            // 获取checkbox选中值
            const selectedTowns = Array.from(document.querySelectorAll('.filter-group:nth-child(1) .checkbox-group input[type="checkbox"]:checked')).map(cb => cb.value);
            const selectedCategories = Array.from(document.querySelectorAll('.filter-group:nth-child(2) .checkbox-group input[type="checkbox"]:checked')).map(cb => cb.value);
            const selectedStatuses = Array.from(document.querySelectorAll('.filter-group:nth-child(3) .checkbox-group input[type="checkbox"]:checked')).map(cb => cb.value);
            
            let filtered = shops;
            
            // 多选筛选逻辑：如果没有选中任何选项，显示全部
            if (selectedTowns.length > 0) {
                filtered = filtered.filter(s => selectedTowns.includes(s.town));
            }
            if (selectedCategories.length > 0) {
                filtered = filtered.filter(s => selectedCategories.includes(s.category));
            }
            if (selectedStatuses.length > 0) {
                filtered = filtered.filter(s => selectedStatuses.includes(getRecord(s.id).status));
            }
            
            // 按距离排序
            if (myPosition) {
                filtered = filtered.map(s => ({
                    ...s,
                    realDistance: getDistance(myPosition.lng, myPosition.lat, s.lng, s.lat)
                })).sort((a, b) => a.realDistance - b.realDistance);
            }
            
            renderShops(filtered);
        }
        
        // 清除筛选
        function clearFilters() {
            document.querySelectorAll('.filter-group input[type="checkbox"]').forEach(cb => cb.checked = false);
            filterShops();
        }
        
        // 全选/清空筛选
        function selectAll(type, checked) {
            let selector = '';
            if (type === 'town') {
                selector = '.filter-group:nth-child(1) input[type="checkbox"]';
            } else if (type === 'category') {
                selector = '.filter-group:nth-child(2) input[type="checkbox"]';
            } else if (type === 'status') {
                selector = '.filter-group:nth-child(3) input[type="checkbox"]';
            }
            document.querySelectorAll(selector).forEach(cb => cb.checked = checked);
            filterShops();
        }
        
        // 切换更多操作面板
        function toggleMoreActions() {
            const panel = document.getElementById('moreActionsPanel');
            if (panel.style.display === 'none' || panel.style.display === '') {
                panel.style.display = 'block';
            } else {
                panel.style.display = 'none';
            }
        }
        
        // 获取位置
        function getLocation() {
            if (!navigator.geolocation) {
                alert('浏览器不支持地理定位');
                return;
            }
            
            document.getElementById('stats').textContent = '正在获取位置...';
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    myPosition = {
                        lng: position.coords.longitude,
                        lat: position.coords.latitude
                    };
                    filterShops();
                },
                (error) => {
                    alert('获取位置失败: ' + error.message);
                    filterShops();
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }
        
        // 初始化
        window.onload = function() {
            loadRecords();
            filterShops();
        };
    </script>
</body>
</html>
